# Stand: docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env up -d --build
# Only Caddy (80/443) is published. Database and Redis are reachable only inside the network.
# Letters: set SMTP_HOST/SMTP_PORT/SMTP_USER/SMTP_PASSWORD in deploy/.env for a real mail server, or start
# with `--profile mailpit` to catch them in Mailpit (127.0.0.1:8025, reach it through an SSH tunnel).
# DEMO_MODE=true opens the jury trial and the jury accounts; a public stand for real people keeps it false.
name: fsp-talent-prod

services:
  caddy:
    image: caddy:2.10-alpine
    # An empty address must not be written into the config: Caddy refuses to start.
    # Set ACME_EMAIL in deploy/.env when there is a mailbox that receives expiry notices.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        cfg=/etc/caddy/Caddyfile
        if [ -n "$$ACME_EMAIL" ]; then
          case "$$ACME_EMAIL" in
            *[!A-Za-z0-9@._+-]*|*"@"*"@"*) echo "ACME_EMAIL is not an address"; exit 1 ;;
          esac
          { printf '{\n\temail %s\n}\n' "$$ACME_EMAIL"; cat "$$cfg"; } > /tmp/Caddyfile
          cfg=/tmp/Caddyfile
        fi
        exec caddy run --config "$$cfg" --adapter caddyfile
    ports: ["80:80", "443:443"]
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS, e.g. 203-0-113-10.sslip.io}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./caddy:/etc/caddy:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [backend, frontend]
    restart: unless-stopped

  backend:
    build: ../backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://fsp_app:${APP_DB_PASSWORD:?}@postgres:5432/fsp_talent
      MIGRATE_DATABASE_URL: postgresql+asyncpg://fsp:${POSTGRES_PASSWORD:?}@postgres:5432/fsp_talent
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?}
      REDIS_URL: redis://redis:6379/0
      PUBLIC_BASE_URL: https://${SITE_ADDRESS}
      CORS_ORIGINS: https://${SITE_ADDRESS}
      VC_PRIVATE_KEY_PATH: /secrets/vc_ed25519.pem
      MAIL_MODE: ${MAIL_MODE:-smtp}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      DEMO_MODE: ${DEMO_MODE:-false}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
    volumes: [vc_keys:/secrets]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_started}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # Weekly tasks, offer expiry, FSP sync and scoring run here; without them the stand misses scheduled work.
  worker:
    build: ../backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://fsp_app:${APP_DB_PASSWORD:?}@postgres:5432/fsp_talent
      REDIS_URL: redis://redis:6379/0
      PUBLIC_BASE_URL: https://${SITE_ADDRESS}
      VC_PRIVATE_KEY_PATH: /secrets/vc_ed25519.pem
      MAIL_MODE: ${MAIL_MODE:-smtp}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      DEMO_MODE: ${DEMO_MODE:-false}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
    command: celery -A app.workers.celery_app worker --loglevel=info -Q scoring,embeddings,maintenance --concurrency=2
    volumes: [vc_keys:/secrets]
    depends_on:
      backend: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "celery --broker \"$$REDIS_URL\" inspect ping -d \"celery@$$HOSTNAME\" --timeout 5"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  beat:
    build: ../backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://fsp_app:${APP_DB_PASSWORD:?}@postgres:5432/fsp_talent
      REDIS_URL: redis://redis:6379/0
      DEMO_MODE: ${DEMO_MODE:-false}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
    command: celery -A app.workers.celery_app beat --loglevel=info --schedule /tmp/celerybeat-schedule
    depends_on:
      backend: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "ls /tmp/celerybeat-schedule* >/dev/null 2>&1"]
      interval: 30s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.31.4
    profiles: ["mailpit"]
    ports: ["127.0.0.1:8025:8025"]
    restart: unless-stopped

  frontend:
    build: ../frontend
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: fsp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: fsp_talent
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fsp -d fsp_talent"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7.2-alpine
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    restart: unless-stopped

  # Nightly dump at 03:30 server time, 14 kept. Restore: see deploy/README.md.
  backup:
    image: pgvector/pgvector:pg16
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?}
    volumes:
      - ./backups:/backups
      - ./backup.sh:/backup.sh:ro
    entrypoint: ["/bin/sh", "-c", "while true; do now=$$(date +%H%M); if [ \"$$now\" = \"0330\" ]; then sh /backup.sh; sleep 60; fi; sleep 30; done"]
    depends_on:
      postgres: {condition: service_healthy}
    restart: unless-stopped

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
  vc_keys:
