# Optional GPU override for the local pair model (CROSS_ENCODER_DEVICE=auto|gpu).
# Needs an NVIDIA card and the NVIDIA Container Toolkit on the host:
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d --build --wait
# or simply: make demo GPU=1
# Spec: https://docs.docker.com/compose/how-tos/gpu-support/
services:
  backend:
    build:
      args:
        INSTALL_RERANKER: "1"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
