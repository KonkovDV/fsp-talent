name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install "ruff==0.16.10"
      - run: ruff check backend/app/

  test-backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: fsp
          POSTGRES_PASSWORD: fsp
          POSTGRES_DB: fsp_talent_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports: ['5432:5432']
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    env:
      DATABASE_URL: postgresql+asyncpg://fsp:fsp@localhost:5432/fsp_talent_test
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: test-secret-key-for-ci-only
      FSP_MODE: mock
      AI_ENABLED: 'false'
      VC_PRIVATE_KEY_PATH: ${{ github.workspace }}/vc_ed25519.pem
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install backend deps
        run: cd backend && pip install -e .[test]
      - name: Run unit tests
        run: cd backend && pytest tests/unit/ -v --cov=app/services --cov-report=xml
      # Unit tests never touch a database. These steps catch a broken migration chain, an
      # unimportable module and a dead API path, which all reached main before.
      - name: Apply migrations
        run: cd backend && alembic upgrade head
      - name: Seed demo data
        run: cd backend && python -m seed.generate_seed
      - name: API smoke test
        run: |
          cd backend
          uvicorn app.main:app --host 127.0.0.1 --port 8010 > /tmp/api.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8010/health && break; sleep 1; done
          python tests/smoke_api.py || (cat /tmp/api.log; exit 1)
      - uses: codecov/codecov-action@v4
        if: always()

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - run: cd frontend && npm ci
      - run: cd frontend && npm run type-check
      - run: cd frontend && npm run build

  docker-build:
    needs: [lint, test-backend, test-frontend]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build backend
        run: docker build -t fsp-talent-backend:${{ github.sha }} ./backend
      - name: Build frontend
        run: docker build -t fsp-talent-frontend:${{ github.sha }} ./frontend

  deploy:
    needs: docker-build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Skip when the server is not configured
        id: gate
        run: |
          if [ -z "${{ secrets.DEPLOY_HOST }}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: appleboy/ssh-action@v1
        if: steps.gate.outputs.skip != 'true'
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ubuntu
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            cd /opt/fsp-talent
            git pull origin main
            docker compose up -d --build --no-deps backend frontend worker beat
            docker compose exec -T backend alembic upgrade head
            echo "Deployed $(date)"
