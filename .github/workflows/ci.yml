name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install "ruff==0.16.10"
      - run: ruff check backend/app backend/seed backend/tests
      - name: No secrets in the tree
        run: |
          curl -fsSL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks detect --source . --config .gitleaks.toml --redact --no-banner

  test-backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: fsp
          POSTGRES_PASSWORD: fsp
          POSTGRES_DB: fsp_talent_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports: ['5432:5432']
      redis:
        image: redis:7.2-alpine
        ports: ['6379:6379']
    env:
      DATABASE_URL: postgresql+asyncpg://fsp:fsp@localhost:5432/fsp_talent_test
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: test-secret-key-for-ci-only
      FSP_MODE: mock
      AI_ENABLED: 'false'
      # Letters go to files; the smoke test reads confirmation codes from there.
      MAIL_MODE: file
      MAIL_FILE_DIR: /tmp/fsp-talent-mail
      VC_PRIVATE_KEY_PATH: ${{ github.workspace }}/vc_ed25519.pem
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      # Test items are re-run in every language a candidate can choose (tests/unit/test_item_families.py).
      # A missing compiler fails the job: the unit test does not skip when CI is set.
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - uses: actions/setup-go@v5
        with: {go-version: '1.22'}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: actions/setup-dotnet@v4
        with: {dotnet-version: '8.0.x'}
      - name: Install Kotlin compiler
        run: |
          curl -fsSL -o kotlin.zip https://github.com/JetBrains/kotlin/releases/download/v2.0.21/kotlin-compiler-2.0.21.zip
          unzip -q kotlin.zip -d "$RUNNER_TEMP/kotlin"
          echo "$RUNNER_TEMP/kotlin/kotlinc/bin" >> "$GITHUB_PATH"
      - name: Install backend deps
        run: cd backend && pip install -c requirements.lock -e .[test]
      - name: Run unit tests
        run: cd backend && pytest tests/unit/ -v --cov=app/services --cov-report=xml --cov-fail-under=63
      - name: Dependency audit
        # python-jose 3.5.0 and ecdsa 0.19.2 have no patched release. pip itself is upgraded first.
        run: |
          python -m pip install -U pip pip-audit
          cd backend && pip-audit --ignore-vuln PYSEC-2026-1325 --ignore-vuln CVE-2026-85394
      # Fixed seed: a broken threshold is a regression in the item generators or the adaptive test.
      - name: Validate the adaptive test
        run: cd backend && python -m app.validation.assessment --n 300 --seed 7 --check
      - name: Validate ranking
        run: cd backend && python -m app.validation.matching --check
      # Unit tests never touch a database. These steps catch a broken migration chain, an
      # unimportable module and a dead API path, which all reached main before.
      - name: Apply migrations
        run: cd backend && alembic upgrade head
      - name: Seed demo data
        run: cd backend && python -m seed.generate_seed
      - name: API smoke test
        run: |
          cd backend
          uvicorn app.main:app --host 127.0.0.1 --port 8010 > /tmp/api.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8010/health && break; sleep 1; done
          python tests/smoke_api.py || (cat /tmp/api.log; exit 1)
      - uses: codecov/codecov-action@v4
        if: always()

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - run: cd frontend && npm ci
      # High findings in the Tailwind build toolchain need a major upgrade. The gate covers what the site ships.
      - run: cd frontend && npm audit --omit=dev --audit-level=high
      - run: cd frontend && npm run type-check
      - run: cd frontend && npm run build

  # The jury's path, word for word: docs/INSTALL.md on a clean machine, then the API check with codes from Mailpit.
  compose-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: make demo (build, start, wait for health checks, load demo data)
        run: make demo 2>&1 | tee /tmp/demo.log; exit ${PIPESTATUS[0]}
      - name: The site, Swagger and health answer through nginx
        run: |
          curl -fsS http://localhost/health
          curl -fsS http://localhost/ | grep -q 'id="root"'
          curl -fsS http://localhost/docs | grep -qi swagger
          curl -fsS http://localhost/openapi.json | python3 -c "import json,sys; print(len(json.load(sys.stdin)['paths']), 'paths')"
      - name: make check (registration, FSP ID, test, search, invitation, contacts)
        run: make check
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - name: Browser journey
        run: |
          cd frontend
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test
      - name: Logs on failure
        if: failure()
        run: |
          docker compose ps -a; docker compose logs --no-color --tail 200
          # Annotations stay readable through the API when the raw log archive is not.
          enc() { sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g'; }
          echo "::error title=make demo::$(tail -n 60 /tmp/demo.log 2>/dev/null | enc)"
          echo "::error title=compose ps::$(docker compose ps -a 2>&1 | enc)"
          for s in backend frontend nginx worker; do
            echo "::error title=$s::$(docker compose logs --no-color --tail 40 $s 2>&1 | enc)"
          done

  docker-build:
    needs: [lint, test-backend, test-frontend]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build backend
        run: docker build -t fsp-talent-backend:${{ github.sha }} ./backend
      - name: Build frontend
        run: docker build -t fsp-talent-frontend:${{ github.sha }} ./frontend

  deploy:
    needs: docker-build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Skip when the server is not configured
        id: gate
        run: |
          if [ -z "${{ secrets.DEPLOY_HOST }}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: appleboy/ssh-action@v1
        if: steps.gate.outputs.skip != 'true'
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ubuntu
          key: ${{ secrets.DEPLOY_KEY }}
          # The public stand runs the production compose (Caddy, HTTPS, backups); migrations run at backend start.
          script: |
            cd /opt/fsp-talent
            git pull origin main
            docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env up -d --build
            echo "Deployed $(date)"
