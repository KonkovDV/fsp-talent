# Host ports are bound to 127.0.0.1: only nginx (:80) is reachable from the network.
services:
  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://fsp:fsp@postgres:5432/fsp_talent
      REDIS_URL: redis://redis:6379/0
      PUBLIC_BASE_URL: http://localhost
      VC_PRIVATE_KEY_PATH: /secrets/vc_ed25519.pem
      # Letters with confirmation codes land in Mailpit: http://localhost:8025. Override in .env for real SMTP.
      MAIL_MODE: ${MAIL_MODE:-smtp}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
    ports: ['127.0.0.1:8010:8000']
    volumes: [vc_keys:/secrets]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_started}
    # FIX: backend was missing healthcheck; worker/beat depend on service_healthy
    # and would hang forever at startup without it.
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  worker:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://fsp:fsp@postgres:5432/fsp_talent
      REDIS_URL: redis://redis:6379/0
      VC_PRIVATE_KEY_PATH: /secrets/vc_ed25519.pem
    command: celery -A app.workers.celery_app worker --loglevel=info -Q scoring,embeddings,maintenance --concurrency=2
    volumes: [vc_keys:/secrets]
    depends_on:
      backend: {condition: service_healthy}
    healthcheck:
      disable: true
    restart: unless-stopped

  beat:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://fsp:fsp@postgres:5432/fsp_talent
      REDIS_URL: redis://redis:6379/0
    command: celery -A app.workers.celery_app beat --loglevel=info --schedule /tmp/celerybeat-schedule
    depends_on:
      backend: {condition: service_healthy}
    healthcheck:
      disable: true
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports: ['127.0.0.1:3010:80']
    depends_on: [backend]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: fsp
      POSTGRES_PASSWORD: fsp
      POSTGRES_DB: fsp_talent
    volumes: [postgres_data:/var/lib/postgresql/data]
    ports: ['127.0.0.1:5432:5432']
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fsp -d fsp_talent"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes: [redis_data:/data]
    ports: ['127.0.0.1:6379:6379']
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:latest
    ports: ['127.0.0.1:8025:8025']
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports: ['80:80']
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on: [backend, frontend]
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  vc_keys:
