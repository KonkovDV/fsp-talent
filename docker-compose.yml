# Local run and demo. Only nginx (:80) is reachable from the network; API (8010), frontend (3010) and
# Mailpit (8025) listen on 127.0.0.1, the database and Redis have no host port at all.
# The volume vc_keys holds the credential signing key and, unless SECRET_KEY is set in .env, the JWT key.
services:
  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://fsp:fsp@postgres:5432/fsp_talent
      REDIS_URL: redis://redis:6379/0
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost}
      # Fifteen-item, five-minute trial for the jury. A production deploy sets DEMO_MODE=false.
      DEMO_MODE: ${DEMO_MODE:-true}
      VC_PRIVATE_KEY_PATH: /secrets/vc_ed25519.pem
      # Letters with confirmation codes land in Mailpit: http://localhost:8025. Override in .env for real SMTP.
      MAIL_MODE: ${MAIL_MODE:-smtp}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SANDBOX_SOCKET: /run/sandbox/sandbox.sock
      SANDBOX_TOKEN: ${SANDBOX_TOKEN:-local-sandbox}
    ports: ['127.0.0.1:8010:8000']
    volumes: [vc_keys:/secrets, sandbox_sock:/run/sandbox]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_started}
      sandbox: {condition: service_started}
    # worker and beat start after this check passes.
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  worker:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://fsp:fsp@postgres:5432/fsp_talent
      REDIS_URL: redis://redis:6379/0
      DEMO_MODE: ${DEMO_MODE:-true}
      VC_PRIVATE_KEY_PATH: /secrets/vc_ed25519.pem
      MAIL_MODE: ${MAIL_MODE:-smtp}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
    command: celery -A app.workers.celery_app worker --loglevel=info -Q scoring,embeddings,maintenance --concurrency=2
    volumes: [vc_keys:/secrets]
    depends_on:
      backend: {condition: service_healthy}
    # Its own check instead of the image's HTTP one: `docker compose up --wait` rejects a service
    # whose check is disabled. The ping goes through Redis and does not import the app.
    healthcheck:
      test: ["CMD-SHELL", "celery --broker \"$$REDIS_URL\" inspect ping -d \"celery@$$HOSTNAME\" --timeout 5"]
      interval: 15s
      timeout: 15s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  beat:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://fsp:fsp@postgres:5432/fsp_talent
      REDIS_URL: redis://redis:6379/0
      DEMO_MODE: ${DEMO_MODE:-true}
    command: celery -A app.workers.celery_app beat --loglevel=info --schedule /tmp/celerybeat-schedule
    volumes: [vc_keys:/secrets]
    depends_on:
      backend: {condition: service_healthy}
    # Beat creates its schedule file on start; without the file it has not come up.
    healthcheck:
      test: ["CMD-SHELL", "ls /tmp/celerybeat-schedule* >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped

  # Practice code (Python, Node). No network, no secrets from .env, read-only root, small limits.
  # The API reaches it only through the socket on the shared volume.
  sandbox:
    build: ./sandbox
    network_mode: none
    read_only: true
    tmpfs: ['/tmp:size=64m,noexec,nosuid']
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    pids_limit: 64
    mem_limit: 256m
    cpus: 0.5
    environment:
      SANDBOX_TOKEN: ${SANDBOX_TOKEN:-local-sandbox}
    volumes: [sandbox_sock:/run/sandbox]
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports: ['127.0.0.1:3010:80']
    depends_on: [backend]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: fsp
      POSTGRES_PASSWORD: fsp
      POSTGRES_DB: fsp_talent
    volumes: [postgres_data:/var/lib/postgresql/data]
    # No host port: a local PostgreSQL on 5432 would block the start. Console: docker compose exec postgres psql -U fsp fsp_talent
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fsp -d fsp_talent"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7.2-alpine
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes: [redis_data:/data]
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.31.4
    ports: ['127.0.0.1:8025:8025']
    restart: unless-stopped

  # Real OIDC check of В«Р’РѕР№С‚Рё С‡РµСЂРµР· Р¤РЎРџ IDВ» only on request: `docker compose --profile fsp-id up -d`
  # with FSP_ID_MODE=oidc. By default the stand uses the built-in mock and does not start Keycloak.
  keycloak:
    profiles: ["fsp-id"]
    image: quay.io/keycloak/keycloak:26.0.7
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME: localhost
      KC_HOSTNAME_PORT: "8080"
      KC_HOSTNAME_STRICT: "false"
    ports: ["127.0.0.1:8080:8080"]
    volumes:
      - ./deploy/keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/8080'"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 90s
    restart: unless-stopped

  nginx:
    image: nginx:1.28-alpine
    # Port 80 busy? Set HTTP_PORT=8080 and PUBLIC_BASE_URL=http://localhost:8080 in .env.
    ports: ['${HTTP_PORT:-80}:80']
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on: [backend, frontend]
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  vc_keys:
  sandbox_sock:
