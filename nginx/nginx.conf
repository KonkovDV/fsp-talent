worker_processes auto;
events { worker_connections 2048; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;

    # Docker DNS. A variable in proxy_pass is resolved on each request, so a recreated
    # container does not leave the site on 502 until nginx itself is restarted.
    resolver 127.0.0.11 ipv6=off valid=10s;

    server {
        listen 80;
        server_name talent.fsp.ru;

        # Security headers — inherited by every location that has no add_header of its own
        add_header X-Frame-Options          SAMEORIGIN always;
        add_header X-Content-Type-Options   nosniff    always;
        add_header Referrer-Policy          strict-origin-when-cross-origin always;
        add_header Content-Security-Policy  "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self' data:; object-src 'none'; frame-ancestors 'none';" always;

        # AI endpoints: GigaChat + resume parsing can take up to 2 min
        location /api/v1/ai/ {
            set $upstream_backend backend:8000;
            proxy_pass         http://$upstream_backend;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_read_timeout    120s;
            proxy_send_timeout    120s;
            proxy_connect_timeout  10s;
        }

        # General API proxy
        location /api/ {
            set $upstream_backend backend:8000;
            proxy_pass         http://$upstream_backend;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_read_timeout     60s;
            proxy_connect_timeout  10s;
        }

        # Docs (served by FastAPI)
        location ~ ^/(docs|redoc|openapi.json) {
            set $upstream_backend backend:8000;
            proxy_pass       http://$upstream_backend;
            proxy_set_header Host $host;
        }

        # Frontend SPA
        location / {
            set $upstream_frontend frontend:80;
            proxy_pass       http://$upstream_frontend;
            proxy_set_header Host $host;
        }
    }

    # HTTPS — enable after: certbot certonly --standalone -d talent.fsp.ru
    # server {
    #     listen 80;
    #     server_name talent.fsp.ru;
    #     return 301 https://$host$request_uri;
    # }
    # server {
    #     listen 443 ssl;
    #     server_name talent.fsp.ru;
    #     ssl_certificate     /etc/letsencrypt/live/talent.fsp.ru/fullchain.pem;
    #     ssl_certificate_key /etc/letsencrypt/live/talent.fsp.ru/privkey.pem;
    #     ssl_protocols       TLSv1.2 TLSv1.3;
    #     ssl_prefer_server_ciphers on;
    #     # copy location blocks from the :80 server above
    # }
}
