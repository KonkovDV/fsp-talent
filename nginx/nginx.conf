worker_processes auto;
events { worker_connections 2048; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;

    # Docker DNS. A variable in proxy_pass is resolved on each request, so a recreated
    # container does not leave the site on 502 until nginx itself is restarted.
    resolver 127.0.0.11 ipv6=off valid=10s;

    server {
        listen 80;
        server_name _;

        # Security headers — inherited by every location that has no add_header of its own
        add_header X-Frame-Options          SAMEORIGIN always;
        add_header X-Content-Type-Options   nosniff    always;
        add_header Referrer-Policy          strict-origin-when-cross-origin always;
        add_header Permissions-Policy       "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy  "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self' data:; object-src 'none'; frame-ancestors 'none';" always;

        # AI endpoints: GigaChat + resume parsing can take up to 2 min
        location /api/v1/ai/ {
            set $upstream_backend backend:8000;
            proxy_pass         http://$upstream_backend;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_read_timeout    120s;
            proxy_send_timeout    120s;
            proxy_connect_timeout  10s;
        }

        # General API proxy. 6m leaves room for a 5 MB PDF plus the multipart wrapper.
        location /api/ {
            client_max_body_size 6m;
            set $upstream_backend backend:8000;
            proxy_pass         http://$upstream_backend;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_read_timeout     60s;
            proxy_connect_timeout  10s;
        }

        # Docs and the health check. The frontend image also proxies these, but its
        # upstream address is fixed at start, so a recreated API returns 502.
        location ~ ^/(docs|redoc|openapi.json|health)$ {
            set $upstream_backend backend:8000;
            proxy_pass       http://$upstream_backend;
            proxy_set_header Host $host;
        }

        # Frontend SPA
        location / {
            set $upstream_frontend frontend:80;
            proxy_pass       http://$upstream_frontend;
            proxy_set_header Host $host;
        }
    }

    # HTTPS on a public stand is terminated by Caddy: deploy/docker-compose.prod.yml and deploy/Caddyfile.
}
