[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fsp-talent"
version = "1.1.0"
description = "LCT-2026: FSP Talent Marketplace"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pgvector>=0.3",
    "redis[asyncio]>=5.0",
    "celery[redis]>=5.4",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-jose[cryptography]>=3.3",
    "bcrypt>=4.0",
    "httpx>=0.27",
    "cryptography>=42",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[project.optional-dependencies]
test = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "httpx>=0.27",
]
ai = [
    "sentence-transformers>=3.0",
    "torch>=2.3",
]
llm = ["gigachat>=0.1.39"]
dev = ["ruff>=0.4", "mypy>=1.10"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
# B008: FastAPI ставит Depends() в значения по умолчанию — это контракт фреймворка.
# DTZ011: date.today() для возраста и давности соревнований — календарная дата, не момент времени.
ignore = ["B008", "DTZ011"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
